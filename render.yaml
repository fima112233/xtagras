services:
  - type: web
    name: xtagras
    plan: free
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/social.db
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: xtagras-data
      mountPath: /data
      sizeGB: 1
